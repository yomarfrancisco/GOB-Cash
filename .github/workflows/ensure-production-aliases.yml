name: Ensure production aliases

# Vercel sometimes leaves custom domains on an older production deploy.
# After each main push, wait for the matching READY deploy and move aliases.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ensure-aliases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Point production domains at this commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_iYeO7yeANF0HbheM3m4mHjUl
          VERCEL_PROJECT_ID: prj_2XOcEqH3vCxy0EDRwd47TKxbENIg
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/ensureProductionAliases.mjs
